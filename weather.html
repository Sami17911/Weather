<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/12607/12607703.png">
    <link href="./style.css" rel="stylesheet"/>
</head>
<body>
    <div class="search-bar">
        <div class="search">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="black"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
              <circle cx="11" cy="11" r="6"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="location" placeholder="Search your city..."/>
        </div>
        <div class="main-content">
            <div id="weather-info"></div>
            <div id="day-time"></div>
            <div id="text"></div>
            <div></div>
            <div id="temp"></div>
            <div></div>
        </div>
        <div class="other">
            <div class="all">
                <div><img src="./wind.svg"></div>
                <div class="content">
                    <h5>Wind</h5>
                    <p id="wind"></p>
                </div>
            </div>
            <div class="all">
                <div><img src="./humidity.svg"></div>
                <div class="content">
                    <h5>Humidity</h5>
                    <p id="humidity"></p>
                </div>
            </div>
            <div class="all">
                <div><img src="./pressur.svg"></div>
                <div class="content">
                    <h5>Pressure</h5>
                    <p id="pressure"></p>
                </div>
            </div>
            <div class="all">
                <div><img src="./cloud.svg"></div>
                <div class="content">
                    <h5>Cloud</h5>
                    <p id="cloud"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
